stages:
  - verify

verify:
  stage: verify
  image: ubuntu:24.04
  tags:
    - perflab
    - size/medium
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
  script:
    - bash -n scripts/*.sh
    - shellcheck scripts/*.sh
    - find README.md docs -name '*.md' -print0 | xargs -0 perl tools/check-markdown-links.pl

docs:pipeline:
  stage: verify
  trigger:
    include:
    - local: .docs-pipeline/ci.yml
    strategy: depend
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH
